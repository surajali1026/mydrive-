name: MyDrive Android Release & Auto-Update CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g. 1.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed Release APK for In-Place Auto-Update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mydrive repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle (works without gradlew wrapper jar)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compute Version Name and Monotonic Version Code
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER_NAME="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ github.event.inputs.release_version }}" ]]; then
            VER_NAME="${{ github.event.inputs.release_version }}"
          else
            VER_NAME="1.0.${{ github.run_number }}"
          fi
          VER_CODE=$((100 + ${{ github.run_number }}))
          echo "version_name=${VER_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VER_CODE}" >> "$GITHUB_OUTPUT"
          echo "Building MyDrive v${VER_NAME} (versionCode=${VER_CODE})"

      - name: Decode Persistent Release Keystore
        # IMPORTANT: Signing every release with the SAME persistent upload keystore
        # (keyAlias = "upload") guarantees Android upgrades MyDrive IN-PLACE without
        # uninstalling or losing local user data.
        run: |
          if [[ -n "${{ secrets.KEYSTORE_BASE64 }}" ]]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-upload-key.jks
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> "$GITHUB_ENV"
          else
            echo "WARNING: KEYSTORE_BASE64 secret not set. Falling back to debug APK build."
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest

      - name: Build Signed Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -f "my-upload-key.jks" ]]; then
            gradle :app:assembleRelease \
              -PmydriveVersionCode=${{ steps.version.outputs.version_code }} \
              -PmydriveVersionName=${{ steps.version.outputs.version_name }}
            APK_SRC="app/build/outputs/apk/release/app-release.apk"
          else
            gradle :app:assembleDebug \
              -PmydriveVersionCode=${{ steps.version.outputs.version_code }} \
              -PmydriveVersionName=${{ steps.version.outputs.version_name }}
            APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          fi
          mkdir -p release-artifacts
          OUT_APK="release-artifacts/mydrive-v${{ steps.version.outputs.version_name }}.apk"
          cp "$APK_SRC" "$OUT_APK"
          sha256sum "$OUT_APK" | awk '{print $1}' > "${OUT_APK}.sha256"
          echo "apk_path=${OUT_APK}" >> "$GITHUB_ENV"
          echo "sha_path=${OUT_APK}.sha256" >> "$GITHUB_ENV"

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mydrive-v${{ steps.version.outputs.version_name }}
          path: release-artifacts/*

      - name: Publish GitHub Release (Consumed by MyDrive In-App Auto-Updater)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: MyDrive v${{ steps.version.outputs.version_name }}
          generate_release_notes: true
          files: |
            ${{ env.apk_path }}
            ${{ env.sha_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
